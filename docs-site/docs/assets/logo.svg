<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ar-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7aa2f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dcfff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#1a1b26" stroke="url(#ar-gradient)" stroke-width="2.5"/>
  <!-- Router hub & multi-LLM nodes -->
  <circle cx="30" cy="50" r="7" fill="#7aa2f7"/>
  <circle cx="72" cy="28" r="6" fill="#7dcfff"/>
  <circle cx="72" cy="50" r="6" fill="#9ece6a"/>
  <circle cx="72" cy="72" r="6" fill="#bb9af7"/>
  <!-- Routing paths -->
  <path d="M37 47 L66 30 M37 50 L66 50 M37 53 L66 70"
        stroke="url(#ar-gradient)"
        stroke-width="3.5"
        stroke-linecap="round"
        fill="none"/>
  <!-- Active pulse indicator -->
  <circle cx="72" cy="50" r="6" fill="#9ece6a">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
