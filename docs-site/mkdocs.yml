# Agentrouter Multi-LLM GCP Documentation
# MkDocs configuration with Material theme

site_name: Agentrouter Multi-LLM GCP
site_url: https://seoeunbae.github.io/agentrouter-multi-llm-gcp
site_author: seoeunbae
site_description: >-
  Enterprise Multi-LLM Serving Platform combining Agentrouter (Envoy AI Gateway),
  Kubernetes Gateway API Inference Extension (GIE), llm-d-router (EPP),
  vLLM, and Vertex AI on Google Kubernetes Engine (GKE).

repo_name: seoeunbae/agentrouter-multi-llm-gcp
repo_url: https://github.com/seoeunbae/agentrouter-multi-llm-gcp
edit_uri: edit/main/docs-site/docs/

# Theme configuration
theme:
  name: material
  language: en
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    # Dark mode (Tokyo Night) - Default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to Light Mode
    # Light mode (Clean White)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light-blue
      toggle:
        icon: material/weather-night
        name: Switch to Dark Mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.svg
  favicon: assets/logo.svg

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
          theme:
            language: ko
          nav_translations:
            Home: 홈
            Getting Started: 시작하기
            Quickstart & Deployment: 빠른 시작 및 배포
            Customer Workshop Guide: 고객 워크숍 가이드
            Architecture & Design: 아키텍처 & 설계
            Gateway & Resource Hierarchy: 게이트웨이 및 리소스 계층 구조
            End-to-End Request Flow: 엔드투엔드 요청 처리 흐름
            Project Specification: 프로젝트 설계 명세
            Verification & Guides: 검증 & 운영 가이드
            Manual Testing Guide: 수동 테스트 가이드
            Claude Code & Vertex AI Compatibility: Claude Code & Vertex AI 호환성 가이드
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: seoeunbae
      repo: agentrouter-multi-llm-gcp
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - docs-site/docs
        - .
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - Quickstart & Deployment: getting-started/quickstart.md
    - Customer Workshop Guide: getting-started/workshop-guide.md
  - Architecture & Design:
    - Gateway & Resource Hierarchy: architecture/gateway-resources.md
    - End-to-End Request Flow: architecture/request-flow.md
    - Project Specification: architecture/project-spec.md
  - Verification & Guides:
    - Manual Testing Guide: operations/manual-test-guide.md
    - Claude Code & Vertex AI Compatibility: operations/claude-code-compatibility.md

# Extra
extra:
  alternate:
    - name: English
      link: /agentrouter-multi-llm-gcp/
      lang: en
    - name: 한국어
      link: /agentrouter-multi-llm-gcp/ko/
      lang: ko
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/seoeunbae/agentrouter-multi-llm-gcp
  generator: false

# Custom CSS
extra_css:
  - stylesheets/extra.css

